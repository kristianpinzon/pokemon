{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PokéDex Django</title>
    <link rel="stylesheet" href="{% static 'pokedex/styles.css' %}">
</head>
<body>
    <h1>PokéDex</h1>
    
    <div class="search-box">
        <form method="GET">
            <input type="text" name="q" value="{{ query }}" placeholder="Buscar por nombre...">
            <button type="submit">Buscar</button>
        </form>
    </div>

    <div class="grid">
        {% for pokemon in pokemons %}
        <div class="card">
            <img src="{{ pokemon.sprite_url }}" alt="{{ pokemon.name }}">
            <p><strong>#{{ pokemon.poke_id }} {{ pokemon.name|capfirst }}</strong></p>
            <div>
                {% for t in pokemon.types.all %}
                    <span class="badge">{{ t.name }}</span>
                {% endfor %}
            </div>
            <a href="{% url 'pokemon_detail' pokemon.poke_id %}">Ver detalle</a>
        </div>
        {% empty %}
        <p style="grid-column: 1/-1; text-align: center;">No se encontraron Pokémon.</p>
        {% endfor %}
    </div>
</body>
</html>
